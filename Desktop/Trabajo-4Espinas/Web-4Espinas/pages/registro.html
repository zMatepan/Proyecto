<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de clinicas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="headersesion">
        <img src="../fotos-videos/Logo-Hospital.png" alt="Logo del hospital" class="logo">
        <h1>Hospital de clinicas.</h1>
    </header>
    <main class="mainsesion">
        <section class="sectionsesion">
            <h2>Registro: </h2>
            <p>
                <label for="nombre">Nombre de usuario: </label>
                <input type="text" id="nombre" name="nombre">
            </p>
            <p>
                <label for="Contrasena1">Escribe una contraseña: </label>
                <input type="password" id="Contrasena1" name="Contrasena1">
            </p>
            <p>
                <label for="contra2">Confirma la contraseña: </label>
                <input type="password" id="contra2" name="contra2">
            </p>
            <p>
                <label for="Cedula">Escribe tu cedula: </label>
                <input type="text" id="Cedula" name="Cedula">
            </p>
            <button class="btn-primary"><a href="../index.html">Inicia secion</a></button>
        </section>
        <aside class="asidesesion">
           <img src="../fotos-videos/Ejemplo-Hospital.jpg" height="380" width="470">
            <img src="../fotos-videos/Directivos-Hospital.jpg" height="380" width="470">
        </aside>
    </main>
    <footer>
        <p>Hospital de clinica</p>
        <p>Todos los derechos reservados por ...</p>
    </footer>
    <script src="../js/java.js"></script>
</body>

</html>
